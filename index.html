/* Plus X Vanilla 토큰. 다크 단일, 라운드 0, 카드는 shadow, 강조는 시안 1~2곳. */
:root{
  color-scheme:light;
  --background:#ffffff; --foreground:#0d0d0d;
  --primary:#0d0d0d; --primary-foreground:#ffffff;
  --muted:#f4f4f4; --muted-foreground:#6b6b6b; --accent:#ececec; --card:#f9f9f9;
  --border:rgba(0,0,0,0.08); --input:rgba(0,0,0,0.12); --ring:#0d0d0d;
  --destructive:#ef4444; --chart-1:#2563eb; --send:#3b82f6;
  --stone-black:#111111; --stone-white:#f5f5f5; --stone-edge:rgba(128,128,128,0.6); --chart-5:#f59e0b; --chart-4:#22c55e;
  --glow:rgba(37,99,235,0.25);
  --shadow-1:0 1px 2px rgba(0,0,0,0.05);
  --shadow-glow:0 0 24px var(--glow);
  --space-2:2px;--space-4:4px;--space-8:8px;--space-12:12px;--space-16:16px;--space-20:20px;--space-24:24px;
  --font-sans:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --duration-quick:150ms;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:#212121; --foreground:#ececec;
  --primary:#ececec; --primary-foreground:#212121;
  --muted:#303030; --muted-foreground:#b4b4b4; --accent:#2f2f2f; --card:#171717;
  --border:rgba(255,255,255,0.1); --input:rgba(255,255,255,0.15); --ring:#ececec;
  --chart-1:#10a37f; --glow:rgba(16,163,127,0.3);
}
:root[data-theme="dark"] .composer{background:var(--muted);box-shadow:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important;animation-duration:0ms!important}}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%;margin:0}
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased;letter-spacing:-0.025em;padding:0}
h2{margin:0}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.container{max-width:1280px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:var(--space-16);min-height:0}
.row{display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap}
.text-muted{color:var(--muted-foreground)}
.caption{font-size:12px;line-height:16px;color:var(--muted-foreground);margin:0}
.btn{height:44px;padding:0 var(--space-20);background:var(--primary);color:var(--primary-foreground);border:0;font-weight:500;transition:all var(--duration-quick) ease-out}
.btn:hover{opacity:.9}
.btn--outline{background:transparent;color:var(--foreground);box-shadow:inset 0 0 0 1px var(--input)}
.btn--outline:hover{background:var(--accent);opacity:1}
.btn--ghost{background:transparent;color:var(--muted-foreground)}
.btn--ghost:hover{background:var(--accent);color:var(--foreground);opacity:1}
.btn--xs{height:32px;padding:0 var(--space-12);font-size:13px}
.input{flex:1;min-width:0;height:44px;padding:0 var(--space-12);background:transparent;border:1px solid var(--input);color:var(--foreground)}
.input::placeholder{color:var(--muted-foreground)}
.card{background:var(--card);box-shadow:var(--shadow-1);padding:var(--space-16)}
@media (min-width:768px){.card{padding:var(--space-24)}}
.card--fill{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-16)}
/* 3단: 사이드바 / 대화 / 캔버스 */
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){.app{grid-template-columns:240px minmax(0,1fr)}.app.canvas-open{grid-template-columns:240px minmax(0,1fr) var(--cw,560px)}}
.side{display:none;background:var(--card);padding:var(--space-16);flex-direction:column;gap:var(--space-4);min-height:0}
@media (min-width:1024px){.side{display:flex}}
.side__item{padding:var(--space-8) var(--space-12);color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side__item--active{background:var(--accent);color:var(--foreground)}
.side__title{font-size:18px;line-height:26px;font-weight:600;padding:var(--space-8) var(--space-12) var(--space-12)}
.side__item{color:var(--foreground)}
.side__label{color:var(--muted-foreground)}
.pagetitle{font-weight:500;margin-right:auto}
.footnote{text-align:center}
.side__label{padding:var(--space-16) var(--space-12) var(--space-4)}
.chatcol{min-height:0;min-width:0;display:flex;flex-direction:column;gap:var(--space-16);padding:var(--space-16)}
@media (min-width:768px){.chatcol{padding:var(--space-16) var(--space-24)}}
.chatwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--space-16);width:100%;max-width:720px;margin:0 auto}
.canvas{display:none;background:var(--card);padding:var(--space-16);min-height:0;flex-direction:column;gap:var(--space-12)}
.app.canvas-open .canvas{display:flex}
.canvas>*:not(.opctl):not(.resizer){opacity:var(--cv,1)}
.canvas{position:relative}
.resizer{display:none;position:absolute;left:-8px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:5;touch-action:none}
.resizer::after{content:"";position:absolute;left:5px;top:50%;width:3px;height:40px;margin-top:-20px;background:var(--border);border-radius:var(--radius-full)}
.resizer:hover::after,.resizer:focus-visible::after,.resizer.drag::after{background:var(--muted-foreground)}
@media (min-width:1024px){.resizer{display:block}}
.iconbtn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-lg)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.h4{font-size:18px;line-height:26px;font-weight:600;letter-spacing:-0.025em}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-24)}
.msg{max-width:100%;display:flex;flex-direction:column;gap:var(--space-2);align-self:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end;max-width:84%}
.bub{padding:0;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.me .bub{background:var(--muted);padding:var(--space-8) var(--space-16)}
.composer{background:var(--background);box-shadow:inset 0 0 0 1px var(--input),var(--shadow-1);min-height:52px;padding:0 var(--space-12) 0 var(--space-20);display:flex;gap:var(--space-8);align-items:center}
.composer .input{border:0;height:36px;padding:0}
.btn--icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn--icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.empty{margin:auto;text-align:center;color:var(--muted-foreground);padding:var(--space-24)}
.empty__title{color:var(--foreground);font-weight:600;font-size:18px;line-height:26px;margin:0 0 var(--space-4)}
.empty p{margin:0}
.seat{display:flex;align-items:center;gap:var(--space-8);background:var(--muted);padding:var(--space-8) var(--space-12);min-width:0}
.seat.turn{box-shadow:inset 0 0 0 1px var(--chart-1)}
.chip{width:12px;height:12px;flex:none}
.chip.b{background:var(--stone-black);box-shadow:0 0 0 1px var(--stone-edge)}
.chip.w{background:var(--stone-white);box-shadow:0 0 0 1px var(--stone-edge)}
#boardwrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
#board{width:min(100%,calc(100vh - 150px),960px);min-width:280px;aspect-ratio:1;display:grid;grid-template-columns:repeat(15,1fr);background:var(--accent)}
.c{position:relative;border:0;background:none;padding:0;min-width:0;min-height:0}
.c::before,.c::after{content:"";position:absolute;background:color-mix(in srgb,var(--muted-foreground) 40%,transparent)}
.c::before{left:0;right:0;top:50%;height:1px}
.c::after{top:0;bottom:0;left:50%;width:1px}
.c.top::after{top:50%}.c.bot::after{bottom:50%}.c.lft::before{left:50%}.c.rgt::before{right:50%}
.c .s{position:absolute;inset:18%;z-index:1}
.c .s.b{background:var(--stone-black);box-shadow:0 0 0 1px var(--stone-edge)}
.c .s.w{background:var(--stone-white);box-shadow:0 0 0 1px var(--stone-edge)}
.c .s.last{outline:2px solid var(--chart-1);outline-offset:1px}
.c .s.win{box-shadow:var(--shadow-glow);outline:2px solid var(--chart-1);outline-offset:1px}
.ghost{position:absolute;inset:30%;background:var(--foreground);opacity:0;z-index:1}
.c.ok:hover .ghost{opacity:.3}
#boss{position:fixed;inset:0;background:var(--background);color:var(--foreground);z-index:50;display:flex;flex-direction:column;font-size:13px;line-height:20px;font-family:var(--font-sans)}
#boss .top{padding:var(--space-8) var(--space-16) 0;display:flex;flex-direction:column;gap:var(--space-2)}
#boss .doc{display:flex;align-items:center;gap:var(--space-12)}
#boss .doc b{font-size:18px;font-weight:400}
#boss .logo{width:20px;height:26px;background:var(--chart-4);flex:none}
#boss .menu{display:flex;gap:var(--space-16);color:var(--foreground)}
#boss .menu span{padding:var(--space-4) var(--space-4)}
#boss .tool{display:flex;gap:var(--space-16);padding:var(--space-8) var(--space-16);background:var(--muted);color:var(--muted-foreground);margin-top:var(--space-4)}
#boss .fx{display:flex;align-items:center;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
#boss .fx .nm{width:60px;padding:var(--space-4) var(--space-12);border-right:1px solid var(--border);color:var(--muted-foreground)}
#boss .fx .ft{padding:var(--space-4) var(--space-12);color:var(--muted-foreground)}
#boss .grid{flex:1;min-height:0;overflow:auto}
#boss table{border-collapse:collapse;min-width:760px;width:100%}
#boss th,#boss td{border:1px solid var(--border);padding:0 var(--space-8);height:24px;white-space:nowrap}
#boss thead th{background:var(--muted);color:var(--muted-foreground);font-weight:400;position:sticky;top:0}
#boss tbody th{background:var(--muted);color:var(--muted-foreground);font-weight:400;width:40px;text-align:center}
#boss td.n{text-align:right}
#boss td.h{font-weight:700;background:var(--accent)}
#boss td.sel{outline:2px solid var(--chart-1);outline-offset:-2px}
#boss .tabsbar{display:flex;gap:var(--space-4);padding:var(--space-4) var(--space-16);background:var(--muted);color:var(--muted-foreground);border-top:1px solid var(--border)}
#boss .tabsbar span{padding:var(--space-4) var(--space-16)}
#boss .tabsbar .on{background:var(--background);color:var(--chart-4);font-weight:700}
/* 라운드: ChatGPT 기준 */
:root{--radius-md:8px;--radius-lg:10px;--radius-xl:14px;--radius-2xl:18px;--radius-full:9999px}
.btn{border-radius:var(--radius-full)}
.btn--xs{border-radius:var(--radius-full)}
.input{border-radius:var(--radius-md)}
.composer{border-radius:var(--radius-full)}
.composer .input{border-radius:0;caret-color:var(--foreground)}
.btn--icon{border-radius:var(--radius-full);background:var(--send);color:#fff}
.side__item{border-radius:var(--radius-lg)}
.msg.me .bub{border-radius:var(--radius-2xl)}
.seat{border-radius:var(--radius-lg)}
.canvas{border-radius:var(--radius-xl)}
@media (min-width:1024px){.canvas{margin:var(--space-12) var(--space-12) var(--space-12) 0}}
#board{border-radius:var(--radius-xl);overflow:hidden}
.c .s,.ghost,.chip{border-radius:var(--radius-full)}
.people{display:flex;gap:var(--space-8);flex-wrap:wrap}
.person{display:flex;align-items:center;gap:var(--space-8);background:var(--muted);padding:var(--space-4) var(--space-12);border-radius:var(--radius-full);font-size:13px}
.person .dot{width:8px;height:8px;border-radius:var(--radius-full);flex:none}
.person .st{color:var(--muted-foreground)}
.statusbox{height:32px;width:auto;flex:none;padding:0 var(--space-8);font-size:13px;border-radius:var(--radius-full)}
.profiles{margin-top:auto;display:flex;flex-direction:column;gap:var(--space-4);padding-top:var(--space-16)}
#people{display:flex;flex-direction:column;gap:var(--space-4)}
.profile{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-8) var(--space-12);border-radius:var(--radius-lg);min-width:0}
.profile.me{background:var(--accent)}
.avatar{width:32px;height:32px;flex:none;border-radius:var(--radius-full);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.pinfo{display:flex;flex-direction:column;min-width:0;font-size:13px;line-height:18px}
.pinfo>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pst{display:flex;align-items:center;gap:var(--space-6,6px);color:var(--muted-foreground);font-size:12px}
.pst .dot{width:8px;height:8px;border-radius:var(--radius-full);flex:none}
.stsel{background:transparent;border:0;padding:0;color:var(--muted-foreground);font-size:12px;cursor:pointer;max-width:100%}
.stsel:focus-visible{outline:2px solid var(--ring)}
.opctl{display:flex;justify-content:space-between;align-items:center;margin:calc(var(--space-8) * -1) 0 calc(var(--space-4) * -1)}
.opctl input{width:96px;height:16px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.opctl input::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--muted-foreground) var(--p,100%),var(--input) var(--p,100%))}
.opctl input::-moz-range-track{height:2px;background:linear-gradient(to right,var(--muted-foreground) var(--p,100%),var(--input) var(--p,100%))}
.opctl input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;background:var(--muted-foreground);border:0;border-radius:var(--radius-full)}
.opctl input::-moz-range-thumb{width:12px;height:12px;background:var(--muted-foreground);border:0;border-radius:var(--radius-full)}
.opctl input:hover::-webkit-slider-thumb{background:var(--foreground)}
.opctl input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.dialog{width:min(480px,calc(100vw - 32px));background:var(--background);color:var(--foreground);border:0;border-radius:var(--radius-2xl);padding:var(--space-24);box-shadow:0 10px 15px -3px rgba(0,0,0,0.25),0 4px 6px -4px rgba(0,0,0,0.25)}
.dialog::backdrop{background:rgba(0,0,0,0.5)}
.seg{display:flex;flex-wrap:wrap;gap:var(--space-8);border:0;padding:0;margin:0 0 var(--space-12)}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-block;padding:var(--space-6,6px) var(--space-12);border-radius:var(--radius-full);background:var(--muted);color:var(--muted-foreground);font-size:13px}
.seg input:checked+span{background:var(--primary);color:var(--primary-foreground)}
.seg input:focus-visible+span{outline:2px solid var(--ring);outline-offset:2px}
.input--textarea{display:block;width:100%;height:auto;min-height:96px;padding:var(--space-12);resize:vertical;line-height:22px}
.side__head{display:flex;align-items:center;justify-content:space-between}
.side__head .side__title{padding-bottom:var(--space-8)}
#opensidebar{display:none}
.app.canvas-open #togglecanvas{display:none}
@media (min-width:1024px){
  .app.side-closed{grid-template-columns:minmax(0,1fr)}
  .app.side-closed.canvas-open{grid-template-columns:minmax(0,1fr) var(--cw,560px)}
  .app.side-closed .side{display:none}
  .app.side-closed #opensidebar{display:inline-flex}
}
#log{scrollbar-width:thin;scrollbar-color:transparent transparent}
#log.scrolling{scrollbar-color:var(--muted-foreground) transparent}
.composer .input:focus,.composer .input:focus-visible{outline:none;box-shadow:none}
.win{text-align:center;width:min(400px,calc(100vw - 32px));padding:var(--space-32,32px) var(--space-24);overflow:visible}
.win__stone{display:block;width:56px;height:56px;margin:var(--space-16) auto var(--space-12);border-radius:var(--radius-full)}
.win__stone.b{background:var(--stone-black);box-shadow:0 0 0 1px var(--stone-edge)}
.win__stone.w{background:var(--stone-white);box-shadow:0 0 0 1px var(--stone-edge)}
.win__title{margin:0;font-size:44px;line-height:52px;font-weight:700;letter-spacing:-0.025em}
.win__name{margin:var(--space-4) 0 0;color:var(--muted-foreground)}
.namebtn{background:none;border:0;padding:0;text-align:left;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer}
.avatar{border:0;cursor:pointer;padding:0}
.pinfo>:first-child{overflow:hidden;white-space:nowrap}
.nrow>span:first-child,.nrow>.namebtn{overflow:hidden;text-overflow:ellipsis}
.pmenu{position:fixed;inset:auto auto 80px 16px;margin:0;width:232px;padding:var(--space-8);background:var(--background);color:var(--foreground);border:0;border-radius:var(--radius-xl);box-shadow:0 10px 15px -3px rgba(0,0,0,0.25),0 0 0 1px var(--border)}
.pm__row{display:flex;align-items:center;gap:var(--space-8);padding:var(--space-4)}
.pm__input{height:32px;padding:0 var(--space-12);font-size:13px;border-radius:var(--radius-full)}
.pm__label{justify-content:space-between;padding:var(--space-8) var(--space-12);cursor:pointer;border-radius:var(--radius-lg)}
.pm__label:hover,.pm__item:hover{background:var(--accent)}
.pm__item{display:block;width:100%;text-align:left;background:none;border:0;padding:var(--space-8) var(--space-12);border-radius:var(--radius-lg);cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;position:relative;width:36px;height:20px;margin:0;border-radius:var(--radius-full);background:var(--muted-foreground);cursor:pointer;flex:none;transition:background var(--duration-quick) ease-out}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:var(--radius-full);background:#fff;transition:transform var(--duration-quick) ease-out}
.switch:checked{background:var(--send)}
.switch:checked::before{transform:translateX(16px)}
.switch:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (min-width:1024px){.lt-desk{display:none}.app.side-closed .lt-desk{display:inline-block}}
#conn{display:inline-flex;align-items:center;gap:var(--space-8);margin-right:auto}
#conn::before{content:"";width:8px;height:8px;border-radius:var(--radius-full);background:var(--muted-foreground)}
#conn.ok::before{background:var(--chart-4)}
.nrow{display:flex;align-items:center;gap:var(--space-4);min-width:0}
.crown{width:14px;height:14px;fill:none;stroke:var(--chart-5);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.opctl{gap:var(--space-8);margin:0}
.opctl #seats{flex:1;min-width:0;display:flex;gap:var(--space-8);flex-wrap:wrap;margin-left:var(--space-4)}
.seat{padding:var(--space-2) var(--space-12);font-size:13px;line-height:24px;gap:var(--space-6,6px);border:0}
button.seat{cursor:pointer;color:var(--muted-foreground);font:inherit;font-size:13px;letter-spacing:inherit}
button.seat:hover{background:var(--accent);color:var(--foreground)}
.seat .x{background:none;border:0;padding:0 0 0 var(--space-4);color:var(--muted-foreground);cursor:pointer;line-height:1;font-size:15px}
.seat .x:hover{color:var(--foreground)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="대화 목록">
    <div class="side__head">
      <div class="side__title">ChatGPT</div>
      <button class="btn btn--ghost iconbtn" id="closesidebar" type="button" aria-label="사이드바 닫기" title="사이드바 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="5"/><path d="M9.5 4v16"/></svg></button>

<script>
(function(){
  var N=15, $=function(id){return document.getElementById(id)};
  var nick=""; try{nick=localStorage.getItem("br-nick")||""}catch(e){}

  /* 방 코드: 주소 뒤 #코드. 없으면 새로 만든다 */
  var room=(location.hash||"").replace("#","").replace(/[^a-z0-9]/gi,"").toLowerCase();
  if(!room){room=Math.random().toString(36).slice(2,8);location.hash=room}
  var HOST_ID="plusxrm-"+room;

  /* 방장이 가진 상태. 손님은 받아서 그리기만 한다 */
  var S={chat:[],game:blank(),count:1,people:{}};
  var peer=null, isHost=false, conns=[], hostConn=null, myId="";

  function blank(){return {cells:Array(N*N+1).join("."),turn:"b",black:null,white:null,winner:"",last:-1,line:""}}
  function winLine(cells,i,ch){
    var r=Math.floor(i/N),c=i%N,dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(var d=0;d<4;d++){
      var dr=dirs[d][0],dc=dirs[d][1],line=[i],k,rr,cc;
      for(k=1;;k++){rr=r+dr*k;cc=c+dc*k;if(rr<0||rr>=N||cc<0||cc>=N||cells[rr*N+cc]!==ch)break;line.push(rr*N+cc)}
      for(k=1;;k++){rr=r-dr*k;cc=c-dc*k;if(rr<0||rr>=N||cc<0||cc>=N||cells[rr*N+cc]!==ch)break;line.push(rr*N+cc)}
      if(line.length>=5)return line;
    }
    return null;
  }
  function broadcast(){
    S.count=conns.length+1;
    conns.forEach(function(c){if(c.open)c.send({t:"state",s:S})});
    render();
  }
  /* 방장만 실행: 모든 동작은 여기서 검증한다 */
  function apply(from,m){
    var g=S.game;
    if(m.t==="chat"){
      var txt=String(m.text||"").slice(0,500).trim(); if(!txt)return;
      S.chat.push({uid:from,name:String(m.name||"익명").slice(0,12),text:txt});
      if(S.chat.length>200)S.chat.shift();
    }else if(m.t==="claim"){
      var key=m.side==="b"?"black":"white", other=m.side==="b"?"white":"black";
      if(g[key]&&g[key].id!==from)return;
      g[key]={id:from,name:String(m.name||"익명").slice(0,12)};
      if(g[other]&&g[other].id===from)g[other]=null;
    }else if(m.t==="leave"){
      var k2=m.side==="b"?"black":"white"; if(g[k2]&&g[k2].id===from)g[k2]=null;
    }else if(m.t==="move"){
      var side=g.black&&g.black.id===from?"b":(g.white&&g.white.id===from?"w":"");
      var i=+m.i; if(!side||g.turn!==side||g.winner||!(i>=0&&i<N*N)||g.cells[i]!==".")return;
      g.cells=g.cells.slice(0,i)+side+g.cells.slice(i+1);
      var line=winLine(g.cells,i,side);
      g.turn=side==="b"?"w":"b"; g.last=i; g.winner=line?side:""; g.line=line?line.join(","):"";
    }else if(m.t==="presence"){
      S.people[from]={name:String(m.name||"익명").slice(0,12),status:String(m.status||"대화 가능").slice(0,8),away:!!m.away};
    }else if(m.t==="reset"){
      var b=g.black,w=g.white; S.game=blank(); S.game.black=b; S.game.white=w;
    }
    broadcast();
  }
  function send(m){
    if(isHost)apply(myId,m);
    else if(hostConn&&hostConn.open)hostConn.send(m);
  }

  /* 연결 */
  function setConn(t,ok){var c=$("conn");c.textContent=t;c.classList.toggle("ok",!!ok)}
  function startAsHost(){
    peer=new Peer(HOST_ID);
    peer.on("open",function(id){isHost=true;myId=id;setConn("1명 접속 중",true);render();sendPresence()});
    peer.on("connection",function(c){
      c.on("open",function(){conns.push(c);broadcast()});
      c.on("data",function(m){apply(c.peer,m)});
      c.on("close",function(){
        conns=conns.filter(function(x){return x!==c});
        delete S.people[c.peer]; var g=S.game; if(g.black&&g.black.id===c.peer)g.black=null; if(g.white&&g.white.id===c.peer)g.white=null;
        broadcast();
      });
    });
    peer.on("error",function(e){
      if(e.type==="unavailable-id"){peer.destroy();startAsGuest()}
      else setConn("연결 오류: "+e.type);
    });
  }
  function startAsGuest(){
    prevWin=null;
    peer=new Peer();
    peer.on("open",function(id){
      myId=id; hostConn=peer.connect(HOST_ID,{reliable:true});
      hostConn.on("open",function(){setConn("연결됨",true);sendPresence()});
      hostConn.on("data",function(m){if(m.t==="state"){S=m.s;if(prevWin===null)prevWin=S.game.winner;render()}});
      hostConn.on("close",function(){setConn("방장이 나갔습니다. 이 링크를 다시 열면 새 방이 열립니다.")});
    });
    peer.on("error",function(e){setConn(e.type==="peer-unavailable"?"방을 찾지 못했습니다. 잠시 뒤 새로고침하세요.":"연결 오류: "+e.type)});
  }
  startAsHost();

  /* 접속자 상태 */
  var myStatus="대화 가능"; try{myStatus=localStorage.getItem("br-status")||myStatus}catch(e){}
  var away=document.hidden||!document.hasFocus();
  function isAway(){return away}
  function setAway(v){if(away===v)return;away=v;sendPresence()}
  function sendPresence(){send({t:"presence",name:myName(),status:myStatus,away:isAway()})}
  var sel=$("status"); sel.value=myStatus;
  sel.onchange=function(){myStatus=sel.value;try{localStorage.setItem("br-status",myStatus)}catch(e){}sendPresence()};
  window.addEventListener("focus",function(){setAway(document.hidden)});
  window.addEventListener("blur",function(){setAway(true)});
  document.addEventListener("visibilitychange",function(){setAway(document.hidden||!document.hasFocus())});
  setInterval(function(){var v=document.hidden||!document.hasFocus();if(v!==away)setAway(v)},2000);
  function renderPeople(){
    $("mecrown").hidden=!isHost;
    var box=$("people"); box.textContent="";
    Object.keys(S.people||{}).forEach(function(id){
      if(id===myId)return;
      var p=S.people[id], label=p.away?p.status+" · 다른 창 보는 중":p.status;
      var color=p.away||p.status==="자리 비움"?"var(--muted-foreground)":p.status==="대화 가능"?"var(--chart-4)":p.status==="회의 중"?"var(--destructive)":"var(--chart-5)";
      var el=document.createElement("div"); el.className="profile";
      var av=document.createElement("span"); av.className="avatar"; av.textContent=(p.name||"?").charAt(0); el.appendChild(av);
      var info=document.createElement("div"); info.className="pinfo";
      var nr=document.createElement("span"); nr.className="nrow";
      var n=document.createElement("span"); n.textContent=p.name; nr.appendChild(n);
      if(id===HOST_ID){var cw=document.createElement("span"); cw.innerHTML='<svg class="crown" viewBox="0 0 24 24" aria-label="방장" role="img"><path d="M11.56 3.27a.5.5 0 0 1 .88 0l2.95 5.6a1 1 0 0 0 1.52.3L21.18 5.5a.5.5 0 0 1 .8.52l-2.83 10.25a1 1 0 0 1-.96.73H5.81a1 1 0 0 1-.96-.73L2.02 6.02a.5.5 0 0 1 .8-.52l4.28 3.67a1 1 0 0 0 1.52-.3z"/><path d="M5 21h14"/></svg>'; nr.appendChild(cw)}
      info.appendChild(nr);
      var st=document.createElement("span"); st.className="pst";
      var d=document.createElement("span"); d.className="dot"; d.style.background=color; st.appendChild(d);
      var t=document.createElement("span"); t.textContent=label; st.appendChild(t); info.appendChild(st);
      el.appendChild(info); box.appendChild(el);
    });
  }
  /* 이름 */
  function showNick(){$("me").textContent=nick||"이름 정하기";$("nickbar").hidden=!!nick;$("mename").textContent=nick||"이름 없음";$("meav").textContent=(nick||"나").charAt(0)}
  function myName(){return nick||"익명"}
  $("me").onclick=function(){$("nickbar").hidden=false;$("nick").value=nick;$("nick").focus()};
  $("nickbar").onsubmit=function(e){
    e.preventDefault();
    var v=$("nick").value.trim().slice(0,12); if(!v)return;
    nick=v; try{localStorage.setItem("br-nick",nick)}catch(x){}
    showNick(); sendPresence(); $("text").focus();
  };
  $("copy").onclick=function(){
    var b=$("copy");
    function done(t){b.textContent=t;setTimeout(function(){b.textContent="링크 복사"},1500)}
    if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(function(){done("복사됨")},function(){done("주소창에서 복사")});
    else done("주소창에서 복사");
  };

  /* 숨기기: 스프레드시트 화면 */
  (function(){
    var head=["항목","10월","11월","12월","합계","전월 대비","비고"];
    var data=[["운영비",1240,1310,1275,"검토 완료"],["광고비",3800,4120,5200,"12월 증액"],["제작비",2650,2410,2980,""],["외주비",1900,2200,2050,"견적 재확인"],["인건비",5200,5200,5350,""],["기타",420,380,510,""]];
    var cols="ABCDEFG", h="<thead><tr><th></th>";
    for(var c=0;c<7;c++)h+="<th>"+cols[c]+"</th>"; h+="</tr></thead><tbody>";
    function fmt(n){return n.toLocaleString()}
    h+="<tr><th>1</th>"+head.map(function(t,k){return '<td class="h'+(k===0?' sel':'')+'">'+t+"</td>"}).join("")+"</tr>";
    var tot=[0,0,0];
    data.forEach(function(r,i){
      var sum=r[1]+r[2]+r[3], diff=Math.round((r[3]-r[2])/r[2]*1000)/10;
      tot[0]+=r[1];tot[1]+=r[2];tot[2]+=r[3];
      h+="<tr><th>"+(i+2)+"</th><td>"+r[0]+'</td><td class="n">'+fmt(r[1])+'</td><td class="n">'+fmt(r[2])+'</td><td class="n">'+fmt(r[3])+'</td><td class="n">'+fmt(sum)+'</td><td class="n">'+(diff>0?"+":"")+diff+"%</td><td>"+r[4]+"</td></tr>";
    });
    var rn=data.length+2, ts=tot[0]+tot[1]+tot[2], td=Math.round((tot[2]-tot[1])/tot[1]*1000)/10;
    h+="<tr><th>"+rn+'</th><td class="h">합계</td><td class="n h">'+fmt(tot[0])+'</td><td class="n h">'+fmt(tot[1])+'</td><td class="n h">'+fmt(tot[2])+'</td><td class="n h">'+fmt(ts)+'</td><td class="n h">'+(td>0?"+":"")+td+'%</td><td class="h"></td></tr>';
    for(var r2=rn+1;r2<=rn+14;r2++){h+="<tr><th>"+r2+"</th>"+"<td></td>".repeat(7)+"</tr>"}
    $("bosstable").innerHTML=h+"</tbody>";
  })();
  function toggleBoss(show){$("boss").hidden=!show}
  $("hide").onclick=function(){toggleBoss(true)};
  $("boss").onclick=function(){toggleBoss(false)};
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("csdlg").open&&!$("windlg").open)toggleBoss($("boss").hidden)});

  /* 문의: Web3Forms로 메일 전달 (공개용 접수 키) */
  var CS_KEY="7e282b2f-1577-4959-9c2b-cea3ebee8caf";
  var csdlg=$("csdlg");
  $("cs").onclick=function(){$("csstatus").textContent="";csdlg.showModal();$("csmsg").focus()};
  $("csclose").onclick=function(){csdlg.close()};
  csdlg.addEventListener("click",function(e){if(e.target===csdlg)csdlg.close()});
  $("csform").onsubmit=function(e){
    e.preventDefault();
    var msg=$("csmsg").value.trim(), st=$("csstatus"), btn=$("cssend");
    if(!msg){st.textContent="내용을 입력해 주세요.";return}
    if($("cshp").value)return;
    if(!CS_KEY){st.textContent="문의 받는 곳이 아직 설정되지 않았습니다.";return}
    var cat=document.querySelector('input[name="cat"]:checked').value;
    btn.disabled=true; st.textContent="보내는 중";
    fetch("https://api.web3forms.com/submit",{
      method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({access_key:CS_KEY,subject:"["+cat+"] 사이트 의견",from_name:$("csname").value.trim()||nick||"익명",message:"분류: "+cat+"\n\n"+msg})
    }).then(function(r){return r.json()}).then(function(j){
      if(j&&j.success){st.textContent="접수되었습니다. 감사합니다.";$("csmsg").value="";setTimeout(function(){csdlg.close()},1200)}
      else st.textContent="보내지 못했습니다. 잠시 뒤 다시 시도해 주세요.";
    }).catch(function(){st.textContent="네트워크 오류로 보내지 못했습니다."}).then(function(){btn.disabled=false});
  };

  /* 채팅 */
  (function(){
    var lg=$("log"), tm=null;
    lg.addEventListener("scroll",function(){
      lg.classList.add("scrolling"); clearTimeout(tm);
      tm=setTimeout(function(){lg.classList.remove("scrolling")},800);
    },{passive:true});
  })();
  function emptyBox(title,desc){
    var d=document.createElement("div");d.className="empty";
    var h=document.createElement("h4");h.className="empty__title";h.textContent=title;
    var p=document.createElement("p");p.textContent=desc;d.appendChild(h);d.appendChild(p);return d;
  }
  var shown=-1;
  function renderChat(){
    if(shown===S.chat.length)return; shown=S.chat.length;
    var log=$("log"); log.textContent="";
    if(!S.chat.length){log.appendChild(emptyBox("아직 대화가 없습니다","먼저 한마디 남겨보세요."));return}
    S.chat.forEach(function(m){
      var w=document.createElement("div"); w.className="msg"+(m.uid===myId?" me":"");
      if(m.uid!==myId){var who=document.createElement("div");who.className="caption";who.textContent=m.name;w.appendChild(who)}
      var b=document.createElement("div"); b.className="bub"; b.textContent=m.text; w.appendChild(b); log.appendChild(w);
    });
    log.scrollTop=log.scrollHeight;
  }
  $("composer").onsubmit=function(e){
    e.preventDefault();
    var t=$("text").value.trim(); if(!t)return;
    if(t==="/승리"||t==="/win"){
      $("text").value="";
      showWin({winner:"b",black:{name:myName()},white:null}); confetti(); return;
    }
    if(!nick){$("nickbar").hidden=false;$("nick").focus();return}
    $("text").value=""; send({t:"chat",name:myName(),text:t});
  };

  /* 승리 모달 */
  function showWin(g){
    var side=g.winner, w=side==="b"?g.black:g.white;
    $("winstone").className="win__stone "+side;
    $("wintitle").textContent=(side==="b"?"흑돌":"백돌")+" WIN!!";
    $("winname").textContent=w&&w.name?w.name+" 님 승리":"";
    if(!$("windlg").open)$("windlg").showModal();
  }
  $("winclose").onclick=function(){$("windlg").close()};
  $("winreset").onclick=function(){$("windlg").close();resetGame()};
  /* 승리 콘페티 */
  var prevWin="";
  function confetti(bx,by){
    if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    var cs=getComputedStyle(document.documentElement);
    var colors=["--chart-1","--chart-4","--chart-5","--destructive","--foreground"].map(function(v){return cs.getPropertyValue(v).trim()||"#888"});
    var cv=document.createElement("canvas");
    cv.setAttribute("aria-hidden","true");
    cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
    var cvOp=parseFloat(getComputedStyle($("canvas")).getPropertyValue("--cv"));
    cv.style.opacity=isNaN(cvOp)?1:cvOp;
    var dpr=window.devicePixelRatio||1, W=window.innerWidth, H=window.innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ($("windlg").open?$("windlg"):document.body).appendChild(cv);
    var ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
    var ps=[], i, burst=(typeof bx==="number");
    var n=burst?90:160;
    for(i=0;i<n;i++){
      var p={w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-0.5)*0.4,c:colors[i%colors.length]};
      if(burst){
        var ang=Math.random()*6.283, sp=3+Math.random()*9;
        p.x=bx; p.y=by; p.vx=Math.cos(ang)*sp; p.vy=Math.sin(ang)*sp-4;
      }else{
        var left=i%2===0;
        p.x=left?0:W; p.y=H*0.7; p.vx=(left?1:-1)*(4+Math.random()*9); p.vy=-(8+Math.random()*13);
      }
      ps.push(p);
    }
    var life=burst?2600:3400, t0=performance.now();
    (function frame(now){
      var t=now-t0; ctx.clearRect(0,0,W,H);
      var alive=false;
      ps.forEach(function(p){
        p.vy+=0.3; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
        if(p.y<H+20)alive=true;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.globalAlpha=Math.max(0,1-Math.max(0,t-(life-1200))/1200);
        ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
      });
      if(alive&&t<life)requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }
  /* 승리 모달이 열려 있는 동안 바깥을 클릭하면 그 자리에서 콘페티 */
  $("windlg").addEventListener("click",function(e){
    var r=$("windlg").getBoundingClientRect();
    var inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
    if(!inside)confetti(e.clientX,e.clientY);
  });
  /* 오목 */
  var board=$("board"), cellEls=[];
  for(var i=0;i<N*N;i++){
    var r=Math.floor(i/N), c=i%N, b=document.createElement("button");
    b.type="button"; b.className="c"+(r===0?" top":"")+(r===N-1?" bot":"")+(c===0?" lft":"")+(c===N-1?" rgt":"");
    b.setAttribute("aria-label",(r+1)+"행 "+(c+1)+"열"); b.dataset.i=i; cellEls.push(b); board.appendChild(b);
  }
  board.addEventListener("click",function(e){var el=e.target.closest(".c");if(el){if(solo)soloMove(+el.dataset.i);else send({t:"move",i:+el.dataset.i})}});
  function syncThemeUI(){$("themeSwitch").checked=document.documentElement.getAttribute("data-theme")==="dark"}
  function applyTheme(dark){
    var d=document.documentElement;
    if(dark)d.setAttribute("data-theme","dark");else d.removeAttribute("data-theme");
    try{localStorage.setItem("br-theme",dark?"dark":"light")}catch(e){}
    themeLabel(); syncThemeUI();
  }
  $("themeSwitch").onchange=function(){applyTheme(this.checked)};
  $("pmenu").addEventListener("toggle",function(e){if(e.newState==="open"){$("nick2").value=nick;syncThemeUI();$("nick2").focus()}});
  $("nickform").onsubmit=function(e){
    e.preventDefault();
    var v=$("nick2").value.trim().slice(0,12); if(!v)return;
    nick=v; try{localStorage.setItem("br-nick",nick)}catch(x){}
    showNick(); sendPresence(); $("pmenu").hidePopover();
  };
  $("csmenu").onclick=function(){$("pmenu").hidePopover();$("cs").onclick()};
  function themeLabel(){$("theme").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"라이트 모드":"다크 모드"}
  $("theme").onclick=function(){
    var d=document.documentElement, dark=d.getAttribute("data-theme")==="dark";
    if(dark)d.removeAttribute("data-theme");else d.setAttribute("data-theme","dark");
    try{localStorage.setItem("br-theme",dark?"light":"dark")}catch(e){}
    themeLabel(); syncThemeUI();
  };
  themeLabel();
  function setOpacity(v){
    v=Math.max(10,Math.min(100,+v||100));
    $("canvas").style.setProperty("--cv",v/100);
    $("opacity").value=v; $("opval").textContent=v+"%"; $("opacity").style.setProperty("--p",((v-10)/90*100)+"%");
    try{localStorage.setItem("br-opacity",v)}catch(e){}
  }
  $("opacity").oninput=function(){setOpacity(this.value)};
  (function(){var v=100;try{v=localStorage.getItem("br-opacity")||100}catch(e){}setOpacity(v)})();
  var DEFAULT_W=560;
  function maxW(){return Math.max(320,Math.min(1000,window.innerWidth-240-320))}
  function setWidth(w){
    w=Math.max(320,Math.min(maxW(),Math.round(w)));
    document.querySelector(".app").style.setProperty("--cw",w+"px");
    try{localStorage.setItem("br-cw",w)}catch(e){}
    return w;
  }
  (function(){var w=DEFAULT_W;try{w=+localStorage.getItem("br-cw")||DEFAULT_W}catch(e){}setWidth(w)})();
  window.addEventListener("resize",function(){var cur=parseInt(getComputedStyle(document.querySelector(".app")).getPropertyValue("--cw"))||DEFAULT_W;setWidth(cur)});
  (function(){
    var rz=$("resizer"), dragging=false;
    rz.addEventListener("pointerdown",function(e){dragging=true;rz.setPointerCapture(e.pointerId);rz.classList.add("drag");document.body.style.userSelect="none";e.preventDefault()});
    rz.addEventListener("pointermove",function(e){if(dragging)setWidth(window.innerWidth-e.clientX-12)});
    function stop(){dragging=false;rz.classList.remove("drag");document.body.style.userSelect=""}
    rz.addEventListener("pointerup",stop); rz.addEventListener("pointercancel",stop);
    rz.addEventListener("dblclick",function(){setWidth(DEFAULT_W)});
    rz.addEventListener("keydown",function(e){
      var cur=parseInt(getComputedStyle(document.querySelector(".app")).getPropertyValue("--cw"))||DEFAULT_W;
      if(e.key==="ArrowLeft"){setWidth(cur+32);e.preventDefault()}
      else if(e.key==="ArrowRight"){setWidth(cur-32);e.preventDefault()}
    });
  })();
  var appEl=document.querySelector(".app");
  function setSide(closed){
    appEl.classList.toggle("side-closed",closed);
    try{localStorage.setItem("br-side",closed?"1":"0")}catch(e){}
  }
  (function(){var v=null;try{v=localStorage.getItem("br-side")}catch(e){}setSide(v==="1")})();
  $("closesidebar").onclick=function(){setSide(true)};
  $("opensidebar").onclick=function(){setSide(false)};
  function setCanvas(open){
    appEl.classList.toggle("canvas-open",open);
    document.querySelectorAll(".tcv").forEach(function(b){b.setAttribute("aria-pressed",open)});
    try{localStorage.setItem("br-canvas",open?"1":"0")}catch(e){}
  }
  var wide=window.matchMedia("(min-width:1024px)").matches, saved=null;
  try{saved=localStorage.getItem("br-canvas")}catch(e){}
  setCanvas(saved===null?wide:saved==="1"&&true);
  document.querySelectorAll(".tcv").forEach(function(b){b.onclick=function(){setCanvas(!appEl.classList.contains("canvas-open"))}});
  $("reset").onclick=function(){resetGame()};
  /* AI와 대결: 내 브라우저에서만 진행, 방에는 영향 없음 */
  var solo=null;
  function cur(){return solo||S.game}
  function soloNew(){return {cells:Array(N*N+1).join("."),turn:"b",black:{id:"me",name:myName()},white:{id:"ai",name:"AI"},winner:"",last:-1,line:""}}
  function placeSolo(i,side){
    solo.cells=solo.cells.slice(0,i)+side+solo.cells.slice(i+1);
    var line=winLine(solo.cells,i,side);
    solo.last=i; solo.turn=side==="b"?"w":"b";
    if(line){solo.winner=side;solo.line=line.join(",")}
  }
  function soloMove(i){
    if(!solo||solo.winner||solo.turn!=="b"||solo.cells[i]!==".")return;
    placeSolo(i,"b"); renderGame();
    if(!solo.winner)setTimeout(aiMove,450);
  }
  function aiMove(){
    if(!solo||solo.winner||solo.turn!=="w")return;
    var i=pickAi(solo.cells); if(i<0)return;
    placeSolo(i,"w"); renderGame();
  }
  function patScore(count,open){
    if(count>=5)return 100000;
    if(open===0)return 0;
    if(count===4)return open===2?10000:1000;
    if(count===3)return open===2?1000:100;
    if(count===2)return open===2?100:10;
    return open===2?10:1;
  }
  function scoreCell(cells,i,p){
    var r=Math.floor(i/N),c=i%N,dirs=[[0,1],[1,0],[1,1],[1,-1]],total=0;
    for(var d=0;d<4;d++){
      var dr=dirs[d][0],dc=dirs[d][1],count=1,open=0,k,rr,cc;
      for(k=1;;k++){rr=r+dr*k;cc=c+dc*k;if(rr<0||rr>=N||cc<0||cc>=N)break;var v=cells[rr*N+cc];if(v===p){count++;continue}if(v===".")open++;break}
      for(k=1;;k++){rr=r-dr*k;cc=c-dc*k;if(rr<0||rr>=N||cc<0||cc>=N)break;var w=cells[rr*N+cc];if(w===p){count++;continue}if(w===".")open++;break}
      total+=patScore(count,open);
    }
    return total;
  }
  function pickAi(cells){
    var any=false,best=-1,bestScore=-1;
    for(var i=0;i<N*N;i++){
      if(cells[i]!==".")continue;
      var r=Math.floor(i/N),c=i%N,near=false;
      for(var dr=-2;dr<=2&&!near;dr++)for(var dc=-2;dc<=2;dc++){
        var rr=r+dr,cc=c+dc; if(rr<0||rr>=N||cc<0||cc>=N)continue;
        if(cells[rr*N+cc]!=="."){near=true;break}
      }
      if(!near)continue; any=true;
      var sc=scoreCell(cells,i,"w")*1.0+scoreCell(cells,i,"b")*0.95+(14-Math.abs(r-7)-Math.abs(c-7))*0.1+Math.random()*0.5;
      if(sc>bestScore){bestScore=sc;best=i}
    }
    if(!any){var mid=7*N+7;return cells[mid]==="."?mid:cells.indexOf(".")}
    return best;
  }
  function resetGame(){
    if(solo){solo=soloNew();prevWin="";renderGame()}
    else send({t:"reset"});
  }
  $("solo").onclick=function(){
    if(solo){solo=null;prevWin=S.game.winner;$("solo").textContent="AI와 대결"}
    else{solo=soloNew();prevWin="";$("solo").textContent="AI 대결 끝내기"}
    renderGame();
  };
  function mySide(){
    if(solo)return "b";
    var g=S.game;
    if(g.black&&g.black.id===myId)return "b";
    if(g.white&&g.white.id===myId)return "w";
    return "";
  }
  function renderSeats(){
    var g=cur(), el=$("seats"); el.textContent="";
    [["b","흑",g.black],["w","백",g.white]].forEach(function(sd){
      var key=sd[0], p=sd[2];
      var turn=!g.winner&&g.turn===key&&g.black&&g.white;
      function chipEl(){var c=document.createElement("span");c.className="chip "+key;return c}
      if(p){
        var box=document.createElement("div"); box.className="seat"+(turn?" turn":"");
        box.appendChild(chipEl());
        var mine=solo?p.id==="me":p.id===myId;
        var t=document.createElement("span"); t.textContent=p.name+(mine?" (나)":""); box.appendChild(t);
        if(!solo&&mine){var x=document.createElement("button");x.type="button";x.className="x";x.textContent="\u00d7";x.setAttribute("aria-label","나가기");x.title="자리 나가기";x.onclick=function(){send({t:"leave",side:key})};box.appendChild(x)}
        el.appendChild(box);
      }else{
        var b=document.createElement("button"); b.type="button"; b.className="seat";
        b.appendChild(chipEl());
        var tt=document.createElement("span"); tt.textContent="앉기"; b.appendChild(tt);
        b.setAttribute("aria-label",sd[1]+" 자리에 앉기"); b.onclick=function(){send({t:"claim",side:key,name:myName()})};
        el.appendChild(b);
      }
    });
  }
  function renderGame(){
    var g=cur(); renderSeats();
    var line=g.line?g.line.split(",").map(Number):[], side=mySide();
    for(var i=0;i<N*N;i++){
      var el=cellEls[i], ch=g.cells[i]; el.textContent="";
      if(ch!=="."){
        var s=document.createElement("span"); s.className="s "+ch+(i===g.last?" last":"")+(line.indexOf(i)>-1?" win":"");
        el.appendChild(s); el.classList.remove("ok");
      }else{
        var can=!g.winner&&side&&g.turn===side; el.classList.toggle("ok",!!can);
        if(can){var gh=document.createElement("span");gh.className="ghost";el.appendChild(gh)}
      }
    }
    var st="";
    if(g.winner){var w=g.winner==="b"?g.black:g.white;st=(g.winner==="b"?"흑":"백")+(w?" "+w.name:"")+" 승리. 새 판을 눌러 다시 하세요."}
    else if(!g.black||!g.white)st="두 명이 앉으면 시작합니다. 흑이 먼저 둡니다.";
    else if(!side)st="구경 중입니다.";
    else st=g.turn===side?"내 차례입니다.":"상대 차례입니다.";
    $("gamestatus").textContent=st;
    if(prevWin!==null){if(!prevWin&&g.winner){showWin(g);if(!(solo&&g.winner==="w"))confetti()}prevWin=g.winner}
  }
  function render(){
    if(isHost||(hostConn&&hostConn.open))setConn(S.count+"명 접속 중",true);
    renderChat(); renderGame(); renderPeople();
  }

  showNick(); render();
})();
</script>
